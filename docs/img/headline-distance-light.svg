<title id="t">How far the held state was from the right state, step by step</title><desc id="d">First 400 requests of one stream. AXI: 0 items off at every step. Replies applied as written: off the right state in four stretches from steps 16, 132, 210, 361, at most 5 items off, exactly right on 85 of 400 steps. Gate only: never corrupted but off from step 16 on, at most 8 items off, exactly right on 84 of 400 steps. The model slipped on 7 of the 400 requests; four slips, at steps 16, 132, 210, 361, each started a wrong stretch.</desc>
